
services:
  app:
    build:
      context: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - ./src/config:/src
      - ./data/web:/vol/web
    environment:
      - PYTHONPATH=/src



    depends_on:
      - db

  db:
    image: postgres:15.4
    ports:
      - "5432:5432"
    volumes:
      - marketshop-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=marketshop
      - POSTGRES_USER=marketshop
      - POSTGRES_PASSWORD=123@456

volumes:
  marketshop-data: